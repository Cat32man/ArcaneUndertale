name: Deploy Godot Web to Pages

on:
  push:
    branches: ["main"] # Change to "master" if your repository uses master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This step extracts your game files out of the zip archive
      - name: Unzip Game Files
        run: |
          mkdir build
          unzip -o "arcaneundertale (1).zip" -d build
          
          # Automatically inject the scope fix into index.html to stop the infinite loop
          sed -i 's|<script src="coi-serviceworker.js"></script>|<script>window.coi = { scope: window.location.pathname };</script><script src="coi-serviceworker.js"></script>|g' build/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
